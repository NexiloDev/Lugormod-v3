name: Build

on:
  release:
    types: [created]
    paths-ignore:
      - "**.md"
      - ".gitignore"
      - "docs/*"
  pull_request:
    branches: [ "develop" ]
    paths-ignore:
      - "**.md"
      - ".gitignore"
      - "docs/*"

env:
  BUILD_DIR: build
  BUNDLE_DIR: ${{ github.workspace }}/build
  RESOURCES_DIR: ${{ github.workspace }}/resources
  ARTIFACT_NAME: Lugormod-${{ github.event.release.tag_name }}

jobs:
  windows-build:
    name: Windows ${{ matrix.arch }} ${{ matrix.build_type }}
    runs-on: windows-2022
    strategy:
      matrix:
        arch: [x86]
        build_type: [Debug, Release]
        include:
          - arch: x86
            platform: Win32
    steps:
      - name: Checkout repository and branch
        uses: 'actions/checkout@v4'

      - name: Add `msbuild` to PATH
        uses: 'microsoft/setup-msbuild@v1.1'

      - name: Setup
        shell: bash
        run: |
          cmake -B ${{ env.BUILD_DIR }} \
          -A ${{ matrix.platform }} \
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build
        shell: pwsh
        run: cmake --build ${{ env.BUILD_DIR }} --config ${{ matrix.build_type }} -j $NUMBER_OF_PROCESSORS

      - name: Install
        if: ${{ matrix.build_type == 'Release' && github.event_name == 'release' }}
        run: cmake --install ${{ github.workspace }}\${{ env.BUILD_DIR }} --config ${{ matrix.build_type }} --prefix ${{ env.RESOURCES_DIR }}\GameData

      - name: Create zip archive of resources
        run: zip -r "${{ env.BUNDLE_DIR }}\${{ env.ARTIFACT_NAME }}.zip" ${{ env.RESOURCES_DIR }}

      - name: Upload artifact
        uses: 'actions/upload-artifact@v4'
        if: ${{ matrix.build_type == 'Release' && github.event_name == 'release' }}
        with:
          name: Lugormod ${{ github.event.release.name }} )${{ matrix.build_type }}) - ${{ runner.os }} ${{ matrix.arch }}
          path: ${{ env.BUNDLE_DIR }}\${{ env.ARTIFACT_NAME }}-${{ runner.os }}-${{ matrix.arch }}.zip

      - name: Upload Release
        if: ${{ matrix.build_type == 'Release' && github.event_name == 'release' }}
        uses: 'actions/github-script@v7'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs').promises;
            for (let filename of await fs.readdir('${{ env.BUNDLE_DIR }}'))
            {
              if (filename.endsWith('.zip'))
              {
                await github.rest.repos.uploadReleaseAsset(
                  {
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    release_id: ${{ github.event.release.id }},
                    name: filename,
                    data: await fs.readFile('${{ env.BUNDLE_DIR }}\' + filename )
                  }
                );
              }
            }


  linux-build:
    name: Linux ${{ matrix.arch }} ${{ matrix.build_type }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x86]
        build_type: [Debug, Release]
        c_compiler: [gcc]
        cpp_compiler: [g++]
    steps:
    - name: Checkout repository and branch
      uses: 'actions/checkout@v4'

    - name: Fetch build dependencies
      run: |
        if [ ${{ matrix.arch }} == "x86" ]; then
          sudo dpkg --add-architecture i386
          sudo apt -qq update
          sudo apt install -y gcc-multilib g++-multilib libc6-dev-i386
        else
          sudo apt-get -qq update
        fi

    - name: Configure CMake
      run: |
        cmake -B ${{ env.BUILD_DIR }} \
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }} \
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }} \
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

    - name: Build
      run: cmake --build ${{ env.BUILD_DIR }} -j $(nproc) 2>&1 | tee ${{ env.BUNDLE_DIR }}/compile.log

    - name: Install
      if: ${{ matrix.build_type == 'Release' && github.event_name == 'release' }}
      run: cmake --install ${{ env.BUILD_DIR }} --config ${{ matrix.build_type }} --prefix ${{ env.RESOURCES_DIR }}/GameData

    - name: Create tar archive
      if: ${{ matrix.build_type == 'Release' && github.event_name == 'release' }}
      run: tar -czvf ${{ env.BUNDLE_DIR }}/${{ env.ARTIFACT_NAME }}.tar.gz -C ${{ env.RESOURCES_DIR }} .

    - name: Upload artifact
      uses: 'actions/upload-artifact@v4'
      if: ${{ matrix.build_type == 'Release' && github.event_name == 'release' }}
      with:
        name: Lugormod ${{ github.event.release.name }}, ${{ matrix.build_type }}, ${{ runner.os }} ${{ matrix.arch }}
        path:  ${{ env.BUNDLE_DIR }}/${{ env.ARTIFACT_NAME }}-${{ runner.os }}-${{ matrix.arch }}.tar.gz

    - name: Upload Release
      uses: 'actions/github-script@v7'
      if: ${{ matrix.build_type == 'Release' && github.event_name == 'release' }}
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const fs = require('fs').promises;
          for (let filename of await fs.readdir('${{ env.BUNDLE_DIR }}'))
          {
            if (filename.endsWith('.tar.gz'))
            {
              await github.rest.repos.uploadReleaseAsset(
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  release_id: ${{ github.event.release.id }},
                  name: filename,
                  data: await fs.readFile('${{ env.BUNDLE_DIR }}/' + filename )
                }
              );
            }
          }
